<!DOCTYPE html><html class="light" lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>Thanh toán - Bill Mates</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#bac3ff",
                        "on-tertiary-fixed": "#410006",
                        "tertiary-container": "#a33236",
                        "secondary-fixed-dim": "#4edea3",
                        "inverse-on-surface": "#f2eff9",
                        "on-primary-fixed-variant": "#293ca0",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "tertiary": "#831921",
                        "outline-variant": "#c5c5d4",
                        "surface-dim": "#dbd9e2",
                        "on-background": "#1a1b22",
                        "on-primary-fixed": "#00105c",
                        "error": "#ba1a1a",
                        "on-secondary-container": "#00714d",
                        "secondary-container": "#6cf8bb",
                        "surface-container-low": "#f4f2fc",
                        "on-tertiary-container": "#ffc4c2",
                        "tertiary-fixed": "#ffdad8",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e9e7f0",
                        "secondary": "#006c49",
                        "primary-container": "#3f51b5",
                        "primary": "#24389c",
                        "on-secondary-fixed-variant": "#005236",
                        "on-surface": "#1a1b22",
                        "surface-container-highest": "#e3e1ea",
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#fbf8ff",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#fbf8ff",
                        "inverse-surface": "#2f3037",
                        "inverse-primary": "#bac3ff",
                        "surface-variant": "#e3e1ea",
                        "on-secondary-fixed": "#002113",
                        "on-tertiary-fixed-variant": "#881d24",
                        "tertiary-fixed-dim": "#ffb3b0",
                        "primary-fixed": "#dee0ff",
                        "background": "#fbf8ff",
                        "on-surface-variant": "#454652",
                        "outline": "#757684",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#6ffbbe",

                    "borderRadius": {

                    "spacing": {

                        "md": "16px",
                        "margin-mobile": "16px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "numeric-xl": ["Be Vietnam Pro"],
                        "label-sm": ["Be Vietnam Pro"],
                        "label-lg": ["Be Vietnam Pro"],
                        "display-md": ["Be Vietnam Pro"],

                        "body-lg": ["Be Vietnam Pro"],
                        "body-md": ["Be Vietnam Pro"],
                        "display-lg-mobile": ["Be Vietnam Pro"],
                        "headline-sm": ["Be Vietnam Pro"]
                    },
                    "fontSize": {

                        "display-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],

                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],

                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
                    }
                }
            }
        }

<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .active-tab-indicator {
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 3px;
            background-color: theme('colors.primary');
            border-radius: 3px 3px 0 0;
        }
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-40">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 bg-surface dark:bg-surface-dim flex justify-between items-center w-full px-margin-mobile py-sm">
<div class="flex items-center gap-md">
<button class="active:scale-95 transition-transform duration-150 text-on-surface-variant">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Thanh toán</h1>
</div>
<div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed font-bold text-xs">
            BM
        </div>
</header>
<main class="max-w-[768px] mx-auto px-margin-mobile py-lg space-y-lg">
<!-- Recipient & Amount Summary -->
<section class="bg-surface-container-lowest rounded-xl p-md border border-outline-variant shadow-[0_2px_8px_rgba(0,0,0,0.04)] text-center space-y-xs">
<p class="font-body-md text-on-surface-variant">Số tiền gửi cho <span class="font-bold text-on-surface">An</span></p>
<h2 class="font-numeric-xl text-numeric-xl text-primary">90.000 ₫</h2>
</section>
<!-- Payment Method Selection -->
<section class="space-y-sm">
<h3 class="font-label-lg text-label-lg text-on-surface-variant px-base uppercase tracking-wider">Phương thức thanh toán</h3>
<div class="grid grid-cols-3 gap-sm">
<!-- Chuyển khoản (Active) -->
<button class="flex flex-col items-center gap-xs p-sm rounded-xl border-2 border-primary bg-primary-container/10 active:scale-95 transition-all">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">account_balance</span>
<span class="font-label-sm text-label-sm text-primary">Chuyển khoản</span>
</button>
<!-- Tiền mặt -->
<button class="flex flex-col items-center gap-xs p-sm rounded-xl border border-outline-variant bg-surface hover:bg-surface-container-low active:scale-95 transition-all">
<span class="material-symbols-outlined text-on-surface-variant">payments</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Tiền mặt</span>
</button>
<!-- Ví điện tử -->
<button class="flex flex-col items-center gap-xs p-sm rounded-xl border border-outline-variant bg-surface hover:bg-surface-container-low active:scale-95 transition-all">
<span class="material-symbols-outlined text-on-surface-variant">account_balance_wallet</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Ví điện tử</span>
</button>
</div>
</section>
<!-- Bank Info Card -->
<section class="bg-primary text-on-primary rounded-xl p-lg space-y-md relative overflow-hidden shadow-lg">
<!-- Background pattern -->
<div class="absolute -right-4 -bottom-4 opacity-10">
<span class="material-symbols-outlined !text-[120px]">account_balance</span>
</div>
<div class="flex justify-between items-start relative z-10">
<div class="space-y-base">
<p class="font-label-sm opacity-80 uppercase tracking-widest">Ngân hàng</p>
<p class="font-headline-sm">Vietinbank</p>
</div>
<div class="bg-white/20 p-2 rounded-lg backdrop-blur-md">
<span class="material-symbols-outlined">contactless</span>
</div>
</div>
<div class="space-y-base relative z-10">
<p class="font-label-sm opacity-80 uppercase tracking-widest">Số tài khoản</p>
<div class="flex items-center gap-sm">
<p class="font-numeric-xl tracking-widest">101882233</p>
<button class="flex items-center justify-center p-xs rounded-full bg-white/20 hover:bg-white/30 transition-colors active:scale-90" onclick="alert('Đã sao chép')">
<span class="material-symbols-outlined text-sm">content_copy</span>
</button>
</div>
</div>
<div class="pt-sm border-t border-white/20 relative z-10">
<p class="font-label-sm opacity-80 uppercase tracking-widest">Chủ tài khoản</p>
<p class="font-body-lg font-bold">LÊ VĂN AN</p>
</div>
</section>
<!-- QR Code Placeholder Section -->
<section class="flex flex-col items-center gap-md">
<div class="w-48 h-48 bg-white p-sm rounded-xl border border-outline-variant shadow-sm flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-contain" data-alt="A clean, high-contrast QR code generated on a white minimalist card background, surrounded by subtle branding for a financial app named Bill Mates. The lighting is bright and even, emphasizing professional UI design. Deep Indigo accents and sharp geometric lines give it a modern fintech aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuArWuA5PQBMg-IjW4Pqv3M5DWcbwXA3tfogomPnRtOCf-42cX5jPV_BLOnQxFfstBC1TxytoiEVX1oMAApuxlLBWYq08ejAAkjwjlZCjOvd6dZEZXZQrYnN2FBobyro8TX--VMTLU5Owrmw-P3k-eP-SWOX0xxyjDnLr3EZT2YFnMVQEDrDutYnK3BJYeuPYgcOcZ9P7mXOmXwezWQA87t7A4sZopgSXp5MMeq4CJJrLr0tBxWfI3PK1WDmX-nFazAI8PWCrDDQ03c">
</div>
<button class="flex items-center gap-xs text-primary font-label-lg active:scale-95 transition-transform">
<span class="material-symbols-outlined">download</span>
<span>Tải mã QR</span>
</button>
</section>
<!-- Form Fields -->
<section class="space-y-md">
<div class="space-y-xs">
<label class="block font-label-lg text-label-lg text-on-surface-variant px-base">Mã giao dịch</label>
<input class="w-full h-[56px] px-md rounded-xl bg-surface border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md" placeholder="VD: FT23000..." type="text">
</div>
<div class="space-y-xs">
<label class="block font-label-lg text-label-lg text-on-surface-variant px-base">Ghi chú</label>
<textarea class="w-full p-md rounded-xl bg-surface border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md" placeholder="Ghi chú cho khoản chi..." rows="2"></textarea>
</div>
<div class="space-y-xs">
<label class="block font-label-lg text-label-lg text-on-surface-variant px-base">Ảnh chuyển khoản</label>
<button class="w-full h-[100px] border-2 border-dashed border-outline-variant rounded-xl flex flex-col items-center justify-center gap-xs hover:bg-surface-container-low transition-colors group">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">add_a_photo</span>
<span class="font-label-sm text-on-surface-variant">Tải ảnh lên (Minh chứng)</span>
</button>
</div>
</section>
<!-- Disclaimer -->
<section class="bg-surface-container-low p-md rounded-xl flex gap-sm items-start border border-outline-variant/30">
<span class="material-symbols-outlined text-tertiary-container mt-0.5">info</span>
<p class="font-body-md text-on-surface-variant text-sm">
                Bill Mates không chuyển tiền trực tiếp, chỉ ghi nhận giao dịch. Vui lòng kiểm tra kỹ thông tin trước khi chuyển.
            </p>
</section>
</main>
<!-- Sticky Primary Action -->
<div class="fixed bottom-0 left-0 right-0 p-margin-mobile bg-surface/80 backdrop-blur-lg z-40 border-t border-outline-variant/20 safe-area-bottom">
<div class="max-w-[768px] mx-auto flex flex-col gap-sm">
<button class="w-full h-[56px] bg-primary text-on-primary rounded-full font-headline-sm flex items-center justify-center gap-sm shadow-lg active:scale-95 transition-transform">
<span>Tôi đã chuyển</span>
<span class="material-symbols-outlined">send</span>
</button>
</div>
</div>
<!-- Scripts for micro-interactions -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                if(this.classList.contains('active-state')) return;
                
                // Toggle effect for method selection (demo only)
                if(this.parentElement.classList.contains('grid-cols-3')) {
                    this.parentElement.querySelectorAll('button').forEach(b => {
                        b.classList.remove('border-primary', 'bg-primary-container/10', 'text-primary');
                        b.classList.add('border-outline-variant', 'bg-surface', 'text-on-surface-variant');
                        b.querySelector('span.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0";
                        b.querySelector('span:last-child').classList.replace('text-primary', 'text-on-surface-variant');
                    });
                    this.classList.replace('border-outline-variant', 'border-primary');
                    this.classList.replace('bg-surface', 'bg-primary-container/10');
                    this.querySelector('span.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
                    this.querySelector('span.material-symbols-outlined').classList.replace('text-on-surface-variant', 'text-primary');
                    this.querySelector('span:last-child').classList.replace('text-on-surface-variant', 'text-primary');
                }
            });
        });
    </script>
</body></html>
