<!DOCTYPE html><html class="light" lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Bill Mates - Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed-dim": "#bac3ff",
                    "on-tertiary-fixed": "#410006",
                    "tertiary-container": "#a33236",
                    "secondary-fixed-dim": "#4edea3",
                    "inverse-on-surface": "#f2eff9",
                    "on-primary-fixed-variant": "#293ca0",
                    "error-container": "#ffdad6",
                    "on-secondary": "#ffffff",
                    "tertiary": "#831921",
                    "outline-variant": "#c5c5d4",
                    "surface-dim": "#dbd9e2",
                    "on-background": "#1a1b22",
                    "on-primary-fixed": "#00105c",
                    "error": "#ba1a1a",
                    "on-secondary-container": "#00714d",
                    "secondary-container": "#6cf8bb",
                    "surface-container-low": "#f4f2fc",
                    "on-tertiary-container": "#ffc4c2",
                    "tertiary-fixed": "#ffdad8",
                    "on-primary": "#ffffff",
                    "surface-container-high": "#e9e7f0",
                    "secondary": "#006c49",
                    "primary-container": "#3f51b5",
                    "primary": "#24389c",
                    "on-secondary-fixed-variant": "#005236",
                    "on-surface": "#1a1b22",
                    "surface-container-highest": "#e3e1ea",
                    "on-error-container": "#93000a",
                    "on-tertiary": "#ffffff",
                    "surface-bright": "#fbf8ff",
                    "surface-container-lowest": "#ffffff",
                    "surface": "#fbf8ff",
                    "inverse-surface": "#2f3037",
                    "inverse-primary": "#bac3ff",
                    "surface-variant": "#e3e1ea",
                    "on-secondary-fixed": "#002113",
                    "on-tertiary-fixed-variant": "#881d24",
                    "tertiary-fixed-dim": "#ffb3b0",
                    "primary-fixed": "#dee0ff",
                    "background": "#fbf8ff",
                    "on-surface-variant": "#454652",
                    "outline": "#757684",
                    "on-error": "#ffffff",
                    "secondary-fixed": "#6ffbbe",
                    "surface-container": "#efedf6",
                    "on-primary-container": "#cacfff",
                    "surface-tint": "#4355b9"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "16px",
                    "sm": "12px",
                    "xs": "8px",
                    "xl": "32px",
                    "base": "4px",
                    "margin-desktop": "48px",
                    "md": "16px",
                    "margin-mobile": "16px",
                    "lg": "24px"
            },
            "fontFamily": {
                    "numeric-xl": ["Be Vietnam Pro"],
                    "label-sm": ["Be Vietnam Pro"],
                    "label-lg": ["Be Vietnam Pro"],
                    "display-md": ["Be Vietnam Pro"],
                    "display-lg": ["Be Vietnam Pro"],
                    "body-lg": ["Be Vietnam Pro"],
                    "body-md": ["Be Vietnam Pro"],
                    "display-lg-mobile": ["Be Vietnam Pro"],
                    "headline-sm": ["Be Vietnam Pro"]
            },
            "fontSize": {
                    "numeric-xl": ["28px", {"lineHeight": "34px", "fontWeight": "700"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "display-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "display-lg-mobile": ["26px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
            display: inline-block;
            vertical-align: middle;
        }
        
        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        @keyframes pulseSoft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .animate-splash {
            animation: fadeInScale 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .logo-hover {
            transition: all 0.3s ease;
        }
        .logo-hover:active {
            transform: scale(0.95);
        }

        body {
            background-color: #fbf8ff; /* Light mode base */
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="bg-surface selection:bg-primary-container selection:text-on-primary-container">
<!-- Splash Screen Container -->
<main class="relative w-full max-w-md h-screen flex flex-col items-center justify-between py-xl px-margin-mobile">
<!-- Top Empty Spacer for balance -->
<div class="h-24"></div>
<!-- Central Identity Cluster -->
<div class="flex flex-col items-center justify-center space-y-md animate-splash">
<!-- Icon Container -->
<div class="relative w-24 h-24 bg-primary rounded-xl flex items-center justify-center shadow-lg transform transition-transform hover:scale-105 active:scale-95">
<span class="material-symbols-outlined text-on-primary text-[48px]" data-icon="group" style="font-variation-settings: 'FILL' 1;">group</span>
<!-- Atmospheric Glow Background (Subtle) -->
<div class="absolute inset-0 bg-primary rounded-xl opacity-20 blur-xl -z-10 animate-[pulseSoft_3s_infinite]"></div>
</div>
<!-- Brand Label -->
<div class="text-center">
<h1 class="font-display-md text-display-md text-primary tracking-tight">Bill Mates</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs opacity-80">Chia sẻ chi phí, gắn kết tình bạn</p>
</div>
</div>
<!-- Footer / Progress Indicator -->
<div class="w-full flex flex-col items-center space-y-lg pb-xl">
<!-- Loading Indicator -->
<div class="relative w-48 h-1 bg-surface-container-high rounded-full overflow-hidden">
<div class="absolute left-0 top-0 h-full bg-primary transition-all duration-300 ease-out" id="progress-bar" style="width: 6.66667%;"></div>
</div>
<!-- Secondary Text -->
<div class="flex flex-col items-center space-y-xs">
<span class="font-label-sm text-label-sm text-outline">Đang khởi tạo ứng dụng...</span>
<div class="flex items-center space-y-0 space-x-base">
<span class="font-label-sm text-label-sm text-primary-container">v2.4.0</span>
</div>
</div>
</div>
</main>
<!-- Decorative Corner Elements (Subtle) -->
<div class="fixed top-0 right-0 p-lg opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-primary text-[120px]" data-icon="payments">payments</span>
</div>
<div class="fixed bottom-0 left-0 p-lg opacity-10 pointer-events-none translate-y-8 -translate-x-8">
<span class="material-symbols-outlined text-primary text-[160px]" data-icon="account_balance">account_balance</span>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progress-bar');
            let width = 0;
            
            // Simulate loading progress
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    // Add subtle success feedback
                    progressBar.classList.add('bg-secondary');
                } else {
                    // Easing simulation: slower near the end
                    const increment = Math.max(1, (100 - width) / 15);
                    width += increment;
                    progressBar.style.width = width + '%';
                }
            }, 50);

            // Simple micro-interaction for the logo
            const logo = document.querySelector('.bg-primary');
            logo.addEventListener('touchstart', () => {
                logo.style.transform = 'scale(0.92)';
            });
            logo.addEventListener('touchend', () => {
                logo.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>
