<script>
        // Simple Micro-interaction for active state scaling
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.classList.add('scale-95');
            });
            btn.addEventListener('mouseup', () => {
                btn.classList.remove('scale-95');
            });
            btn.addEventListener('mouseleave', () => {
                btn.classList.remove('scale-95');
            });
        });

        // Tab switching logic (Visual only)
        const tabs = document.querySelectorAll('nav[class*="mt-xl"] button');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.querySelector('span').classList.remove('text-primary');
                    t.querySelector('span').classList.add('text-on-surface-variant');
                    const indicator = t.querySelector('div');
                    if (indicator) indicator.remove();
                });
                
                tab.querySelector('span').classList.remove('text-on-surface-variant');
                tab.querySelector('span').classList.add('text-primary');
                
                const newIndicator = document.createElement('div');
                newIndicator.className = 'absolute bottom-0 left-0 w-full h-[3px] bg-primary rounded-t-full';
                tab.appendChild(newIndicator);
            });
        });
    </script>
