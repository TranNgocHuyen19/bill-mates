<!DOCTYPE html><html class="light" lang="vi"><head>

            -webkit-tap-highlight-color: transparent;

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            background: rgba(251, 248, 255, 0.8);
        }
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }

                    "colors": {

                        "on-surface-variant": "#454652",
                        "tertiary-container": "#a33236",
                        "on-primary-container": "#cacfff",
                        "primary-fixed": "#dee0ff",
                        "on-tertiary-fixed": "#410006",
                        "error": "#ba1a1a",
                        "primary-container": "#3f51b5",
                        "primary": "#24389c",
                        "on-primary-fixed-variant": "#293ca0",
                        "secondary-fixed-dim": "#4edea3",
                        "secondary-container": "#6cf8bb",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#ffdad8",
                        "on-tertiary-container": "#ffc4c2",
                        "secondary-fixed": "#6ffbbe",
                        "on-surface": "#1a1b22",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#ffb3b0",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#fbf8ff",
                        "secondary": "#006c49",

                        "on-tertiary-fixed-variant": "#881d24",

                    "fontFamily": {
                        "display-md": ["Be Vietnam Pro"],
                        "display-lg": ["Be Vietnam Pro"],

</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col items-center">
<!-- Top App Bar (As specified in JSON) -->
<header class="fixed top-0 w-[390px] z-50 glass-header flex justify-between items-center px-margin-mobile py-sm">
<div class="flex items-center gap-sm">
<button class="p-xs text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary">Thêm chi phí</h1>
</div>
<div class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="A close-up, high-quality portrait of a friendly young Vietnamese professional with a warm smile, set against a soft-focus office background with natural lighting. The aesthetic is clean, corporate, and trustworthy, featuring a palette of soft blues and crisp whites to match the modern UI design." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC6tWHzWfei6e1jdLHqqwAmxvcSjFOSo8zXc9rb8hqfB_KFeV1-0NW2rfS1LDWHNmB4_Mslm_eGnEkfN2oypwYOYRZp_P-X6iA_4wQl8A0faszTi5ghyOup3BPsyk2tJw0eKaidUtSC5Vk2GKt7kcecXdG5HzUVndUcPF1nI2YPZXR5f4UsvsVWjZDQmWNMSAXxBWkDEhf2S-akDQpcHT68PdTdZEtgBKs2Ik6sOH5hKSrXPzFc9YOU94jNXzaDNS4gsUsnXz1Ft-c">
</div>
</header>
<!-- Main Content Canvas (390px mobile constraint) -->
<main class="w-[390px] pt-[72px] pb-[120px] px-margin-mobile flex flex-col gap-lg overflow-y-auto">
<!-- Progress Indicator -->
<div class="flex flex-col gap-sm pt-xs">
<div class="flex justify-between items-center px-xs">
<div class="flex flex-col items-center gap-base">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-lg">1</div>
<span class="font-label-sm text-label-sm text-primary">Thông tin</span>
</div>
<div class="flex-1 h-[2px] bg-outline-variant mx-xs mb-5"></div>
<div class="flex flex-col items-center gap-base opacity-40">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center font-label-lg">2</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Chia tiền</span>
</div>
<div class="flex-1 h-[2px] bg-outline-variant mx-xs mb-5"></div>
<div class="flex flex-col items-center gap-base opacity-40">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center font-label-lg">3</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Xác nhận</span>
</div>
</div>
</div>
<!-- Form Section -->
<div class="flex flex-col gap-md">
<!-- Amount Input (High Focus) -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md shadow-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-xs">Tổng tiền</label>
<div class="flex items-center justify-between">
<span class="font-numeric-xl text-numeric-xl text-primary">200.000</span>
<span class="font-display-md text-display-md text-on-surface-variant">₫</span>
</div>
</div>
<!-- Standard Inputs -->
<div class="flex flex-col gap-md">
<!-- Expense Name -->
<div class="relative">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-xs ml-base">Tên khoản chi</label>
<input class="w-full h-12 px-md bg-white border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-lg text-body-lg text-on-surface" type="text" value="Ăn tối cuối tuần">
</div>
<!-- Payer Selection -->
<div class="relative">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-xs ml-base">Người đã trả</label>
<button class="w-full h-12 px-md bg-white border border-outline-variant rounded-lg flex items-center justify-between text-left focus:border-primary outline-none transition-colors">
<div class="flex items-center gap-sm">
<div class="w-6 h-6 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center text-[10px] font-bold">BT</div>
<span class="font-body-lg text-body-lg text-on-surface">Bạn (Bảo Trung)</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">expand_more</span>
</button>
</div>
<!-- Date and Shop Row -->
<div class="grid grid-cols-2 gap-md">
<div class="relative">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-xs ml-base">Ngày chi</label>
<div class="relative">
<input class="w-full h-12 px-md pr-xs bg-white border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-lg text-body-lg text-on-surface appearance-none" type="date" value="2023-10-27">
<span class="material-symbols-outlined absolute right-3 top-3 text-on-surface-variant pointer-events-none">calendar_today</span>
</div>
</div>
<div class="relative">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-xs ml-base">Cửa hàng</label>
<input class="w-full h-12 px-md bg-white border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-lg text-body-lg text-on-surface" placeholder="Nhập tên shop" type="text" value="Phở Thìn">
</div>
</div>
<!-- Receipt Upload -->
<div class="relative">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-xs ml-base">Hóa đơn</label>
<div class="w-full border-2 border-dashed border-outline-variant rounded-xl p-lg flex flex-col items-center justify-center gap-xs bg-surface-container-low hover:bg-surface-container transition-colors cursor-pointer active:scale-[0.98]">
<span class="material-symbols-outlined text-primary text-[32px]">receipt_long</span>
<span class="font-label-lg text-label-lg text-primary">Tải lên ảnh hóa đơn</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Hỗ trợ JPG, PNG, PDF</span>
</div>
</div>
<!-- Note -->
<div class="relative">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-xs ml-base">Ghi chú</label>
<textarea class="w-full min-h-[100px] p-md bg-white border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-lg text-body-lg text-on-surface resize-none" placeholder="Nhập thêm chi tiết...">Liên hoan nhóm cuối tháng, có gọi thêm bia.</textarea>
</div>
</div>
</div>
</main>
<!-- Sticky Bottom Bar -->
<footer class="fixed bottom-0 w-[390px] z-50 bg-white shadow-[0_-4px_16px_rgba(0,0,0,0.06)] px-margin-mobile pt-md pb-safe">
<div class="flex gap-md w-full mb-md">
<button class="flex-1 h-12 rounded-full border border-outline text-on-surface font-label-lg active:bg-surface-container transition-colors">
                Lưu nháp
            </button>
<button class="flex-[2] h-12 rounded-full bg-primary text-on-primary font-label-lg shadow-lg active:scale-95 transition-all flex items-center justify-center gap-xs">
                Tiếp tục
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</footer>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input, textarea, button');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    // Subtle ripple or border effect handled by tailwind ring
                });
            });

            // Handle bottom safe area for specific mobile browsers
            const updateSafeArea = () => {
                const bottomBar = document.querySelector('footer');
                const bottomPadding = getComputedStyle(document.documentElement).getPropertyValue('--safe-area-inset-bottom');
                if (bottomPadding && bottomPadding !== '0px') {
                    bottomBar.style.paddingBottom = `calc(16px + ${bottomPadding})`;
                }
            };
            window.addEventListener('resize', updateSafeArea);
            updateSafeArea();
        });
    </script>
</body></html>
